name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
  pull_request:
    paths: ["mea_hub/**", "build/**", "run.py", "requirements*.txt", "tests/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller build/mea_hub.spec --noconfirm --distpath dist/bin --workpath build/work
      - name: Fetch draw.io (Apache-2.0) for offline editing
        run: python fetch_drawio.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MEA_Process_Hub/source_documents | Out-Null
          if (Test-Path source_documents) { Copy-Item source_documents/* dist/MEA_Process_Hub/source_documents/ -Force }
          Copy-Item dist/bin/MEA_Process_Hub.exe dist/MEA_Process_Hub/
          Copy-Item drawio_webapp dist/MEA_Process_Hub/drawio_webapp -Recurse
          Copy-Item README.md dist/MEA_Process_Hub/
          Copy-Item docs dist/MEA_Process_Hub/docs -Recurse
      - name: Smoke-test the EXE (first-start import, login, library, DOCX + PDF export)
        shell: pwsh
        run: |
          $data = "$PWD/smoke_data"
          $env:MEA_HUB_DATA = $data
          $base = "http://127.0.0.1:8799"
          $p = Start-Process dist/MEA_Process_Hub/MEA_Process_Hub.exe -ArgumentList "--no-browser","--port","8799" -PassThru `
                 -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err
          try {
            $ok = $false
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep 2
              try { if ((Invoke-WebRequest "$base/api/config" -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            }
            if (-not $ok) { throw "EXE did not start within 240 s" }
            $pw = ((Get-Content "$data/FIRST_RUN_ADMIN_PASSWORD.txt" | Where-Object { $_ -like 'password:*' }) -replace '^password:\s*', '').Trim()
            $login = Invoke-RestMethod "$base/api/login" -Method Post -ContentType 'application/json' -SessionVariable sess `
                       -Body (@{ username = 'admin'; password = $pw } | ConvertTo-Json)
            $h = @{ 'X-CSRF-Token' = $login.csrf }
            Invoke-RestMethod "$base/api/password" -Method Post -WebSession $sess -Headers $h -ContentType 'application/json' `
              -Body (@{ old = $pw; new = 'Smoke#Test2026' } | ConvertTo-Json) | Out-Null
            $lib = Invoke-RestMethod "$base/api/library" -WebSession $sess
            Write-Host "Processes in library: $($lib.processes.Count)"
            if ($lib.processes.Count -lt 40) { throw "Expected the source documents to be imported (got $($lib.processes.Count) processes)" }
            foreach ($fmt in 'docx', 'pdf') {
              $e = Invoke-RestMethod "$base/api/exports" -Method Post -WebSession $sess -Headers $h -ContentType 'application/json' `
                     -Body (@{ scope = 'handbook'; fmt = $fmt } | ConvertTo-Json)
              Write-Host "Handbook $fmt export: $($e.export.status), $($e.export.size) bytes"
              if ($e.export.status -ne 'done' -or $e.export.size -lt 100000) { throw "$fmt export failed" }
            }
          } catch {
            Write-Host "---- EXE output ----"; Get-Content smoke.log, smoke.err -ErrorAction SilentlyContinue
            if (Test-Path "$data/error.log") { Write-Host "---- error.log ----"; Get-Content "$data/error.log" }
            throw
          } finally {
            Stop-Process $p -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MEA_Process_Hub_win64
          path: dist/MEA_Process_Hub
          retention-days: 30
