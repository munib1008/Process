name: Build Windows EXE
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the package as a GitHub Release under this tag (e.g. v1.0.0). Leave empty to build only."
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["claude/**"]
  pull_request:
    paths: ["mea_hub/**", "build/**", "run.py", "requirements*.txt", "tests/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # needed only by the release step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller build/mea_hub.spec --noconfirm --distpath dist/bin --workpath build/work
      - name: Fetch draw.io (Apache-2.0) for offline editing
        run: python fetch_drawio.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MEA_Process_Hub/source_documents | Out-Null
          if (Test-Path source_documents) { Copy-Item source_documents/* dist/MEA_Process_Hub/source_documents/ -Recurse -Force }
          Copy-Item dist/bin/MEA_Process_Hub.exe dist/MEA_Process_Hub/
          Copy-Item drawio_webapp dist/MEA_Process_Hub/drawio_webapp -Recurse
          Copy-Item README.md dist/MEA_Process_Hub/
          Set-Content -Encoding ascii "dist/MEA_Process_Hub/Reset admin password.bat" "@echo off`r`n""%~dp0MEA_Process_Hub.exe"" --reset-admin`r`npause"
          Copy-Item docs dist/MEA_Process_Hub/docs -Recurse
      - name: Smoke-test the EXE (first-start import, login, library, DOCX + PDF export, flow builder)
        shell: pwsh
        run: |
          $data = "$PWD/smoke_data"
          $env:MEA_HUB_DATA = $data
          $base = "http://127.0.0.1:8799"
          $p = Start-Process dist/MEA_Process_Hub/MEA_Process_Hub.exe -ArgumentList "--no-browser","--port","8799" -PassThru `
                 -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err
          try {
            $ok = $false
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep 2
              try { if ((Invoke-WebRequest "$base/api/config" -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
            }
            if (-not $ok) { throw "EXE did not start within 240 s" }
            $pw = ((Get-Content "$data/FIRST_RUN_ADMIN_PASSWORD.txt" | Where-Object { $_ -like 'password:*' }) -replace '^password:\s*', '').Trim()
            $login = Invoke-RestMethod "$base/api/login" -Method Post -ContentType 'application/json' -SessionVariable sess `
                       -Body (@{ username = 'admin'; password = $pw } | ConvertTo-Json)
            $h = @{ 'X-CSRF-Token' = $login.csrf }
            Invoke-RestMethod "$base/api/password" -Method Post -WebSession $sess -Headers $h -ContentType 'application/json' `
              -Body (@{ old = $pw; new = 'Smoke#Test2026' } | ConvertTo-Json) | Out-Null
            $lib = Invoke-RestMethod "$base/api/library" -WebSession $sess
            Write-Host "Processes in library: $($lib.processes.Count)"
            if ($lib.processes.Count -lt 90) { throw "Expected the source documents to be imported (got $($lib.processes.Count) processes)" }
            foreach ($fmt in 'docx', 'pdf') {
              $e = Invoke-RestMethod "$base/api/exports" -Method Post -WebSession $sess -Headers $h -ContentType 'application/json' `
                     -Body (@{ scope = 'handbook'; fmt = $fmt } | ConvertTo-Json)
              Write-Host "Handbook $fmt export: $($e.export.status), $($e.export.size) bytes"
              if ($e.export.status -ne 'done' -or $e.export.size -lt 100000) { throw "$fmt export failed" }
            }
            $flow = Invoke-RestMethod "$base/api/flows/build" -Method Post -WebSession $sess -Headers $h -ContentType 'application/json' `
                      -Body (@{ title = 'Smoke flow'; steps = "Logistics: Create delivery (VL01N)`nStock available?`nNo: End`nWarehouse: Post goods issue" } | ConvertTo-Json)
            Write-Host "Flow built from text: $($flow.steps) steps, $($flow.warnings.Count) remarks"
            if ($flow.steps -ne 3 -or $flow.warnings.Count -ne 0) { throw "Flow builder failed" }
            $shapes = Invoke-RestMethod "$base/api/flow-library" -WebSession $sess
            Write-Host "Shape library: $($shapes.entries.Count) shapes"
            if ($shapes.entries.Count -lt 20) { throw "Shape library is incomplete" }
          } catch {
            Write-Host "---- EXE output ----"; Get-Content smoke.log, smoke.err -ErrorAction SilentlyContinue
            if (Test-Path "$data/error.log") { Write-Host "---- error.log ----"; Get-Content "$data/error.log" }
            throw
          } finally {
            Stop-Process $p -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MEA_Process_Hub_win64
          path: dist/MEA_Process_Hub
          retention-days: 30
      - name: Publish GitHub Release (only for a v* tag or when a release tag was entered)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.]+)?$') { throw "Release tag '$($env:TAG)' is not of the form v1.2.3" }
          $zip = "dist/MEA_Process_Hub_win64_$($env:TAG).zip"
          Compress-Archive -Path dist/MEA_Process_Hub -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Package: $zip ($mb MB)  SHA256 $sha"
          $notes = @(
            "Windows package of MEA Process Hub, built and smoke-tested by GitHub Actions from commit $($env:GITHUB_SHA.Substring(0, 7)).",
            "",
            "**Use**",
            "1. Download ``MEA_Process_Hub_win64_$($env:TAG).zip`` below and unzip it to a local folder.",
            "2. Start ``MEA_Process_Hub.exe``. The browser opens at http://127.0.0.1:8765/.",
            "3. The first start imports the source documents and shows a one-time ``admin`` password in the console window (also saved in ``data\FIRST_RUN_ADMIN_PASSWORD.txt``). It must be changed at first sign-in.",
            "4. Password lost: run ``Reset admin password.bat``.",
            "",
            "**Know before use**",
            "- The EXE is not code-signed; Windows SmartScreen will ask for confirmation.",
            "- Each copy keeps its own ``data`` folder. Copies do not share processes, approvals or audit comments.",
            "- Imported content is unapproved until it has passed the review workflow in the tool.",
            "",
            "SHA256 of the ZIP: ``$sha``"
          ) -join "`n"
          Set-Content -Encoding utf8 release_notes.md $notes
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases" }
          if ($existing -contains $env:TAG) {
            gh release upload $env:TAG $zip --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload to the existing release failed" }
            gh release edit $env:TAG --notes-file release_notes.md
          } else {
            gh release create $env:TAG $zip --target $env:GITHUB_SHA --title "MEA Process Hub $($env:TAG)" --notes-file release_notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
