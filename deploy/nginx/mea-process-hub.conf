# nginx site that publishes MEA Process Hub over HTTPS (reverse proxy to http://127.0.0.1:8765).
# Replace the server name and the certificate paths. Written for this purpose; NOT run on nginx here.
server {
    listen 443 ssl;
    server_name processhub.example.com;

    ssl_certificate     /etc/ssl/certs/processhub.crt;
    ssl_certificate_key /etc/ssl/private/processhub.key;

    client_max_body_size 100m;                 # document imports and backups
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;           # must be listed in MEA_HUB_ALLOW_HOSTS
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;               # large exports
    }
}
server {
    listen 80;
    server_name processhub.example.com;
    return 301 https://$host$request_uri;
}
